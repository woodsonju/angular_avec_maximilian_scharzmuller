<p>
  <!--          👆
    ./ = route COURANTE : 
      reste sur la même URL
      mais permet d'ajouter/modifier des query params

    [queryParams]="{ order: 'asc' }" ajoute ?order=asc à l'URL. 
    Les crochets [] sont obligatoires car queryParams attend un objet JavaScript 
    — sans crochets, Angular traiterait la valeur comme une simple string
  -->
  <a routerLink="./" , [queryParams]="{ order: 'asc' }">
    Sort Ascending / Descending
  </a>
</p>

<ul>
  @for (task of userTasks(); track task.id) {
    <li>
      <app-task [task]="task" />
    </li>
  } @empty {
    <p>There are no tasks yet. Start adding some!</p>
  }
</ul>
